<!doctype html>
<html>
  <head>
    <title>Blackjack</title>
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Blackjack</h1>
    <h2>Start new singleplayer game</h2>
    <button onclick="startSingleplayerGame()">Start Singleplayer Game</button>
    <h2>Create multiplayer lobby</h2>
    <button onclick="createMultiplayerLobby()">Create Multiplayer Lobby</button>
    <h2>Join existing lobby</h2>
    <!-- Text entry form -->
    <form action="" onsubmit="joinLobby(event)">
      <label>
        Lobby ID:
        <input type="text" id="lobbyId" autocomplete="off" value="foo" />
      </label>
      <button onclick="joinLobby(event)">Join Lobby</button>
    </form>
    <hr />
    <button onclick="connect(event)">Connect</button>
    <button onclick="disconnect(event)">Disconnect</button>
    <hr />
    <form action="" onsubmit="sendMessage(event)">
      <label>
        Message:
        <input type="text" id="messageText" autocomplete="off" />
      </label>
      <button>Send</button>
    </form>
    <ul id="messages"></ul>
  </body>
</html>

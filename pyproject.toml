[project]
name = "blackjack"
version = "2026.2.1"
description = "Basic blackjack game implemented in Python"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
  "coverage>=7.13.4",
  "pytest>=9.0.2",
]
web = [ "fastapi>=0.128.8" ]

[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "DEBUG"

[tool.basedpyright]
stubPath = "src"

[tool.coverage.report]
exclude_also = [ "def __repr__" ]

[tool.ruff]
indent-width = 2
